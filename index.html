<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cita del día para Gio</title>

  <meta name="description" content="Una cita literaria o filosófica cada día.">
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cita del día">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0f1419;
      --bg-2: #1a2332;
      --card: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --ink: #f5f1e8;
      --ink-dim: #a8a094;
      --accent: #d4a574;
      --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #2a3548 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #3d2a3a 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 48px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header { text-align: center; margin-bottom: 48px; }
    .date {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 12px;
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 32px;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .brand::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 16px auto 0;
    }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 56px 40px 48px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      animation: fadeIn 0.6s ease-out;
    }
    .quote-mark {
      position: absolute;
      top: 8px;
      left: 24px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 96px;
      line-height: 1;
      color: var(--accent);
      opacity: 0.4;
      font-style: italic;
    }
    .quote {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: italic;
      font-size: 26px;
      line-height: 1.5;
      color: var(--ink);
      margin-bottom: 24px;
      text-align: left;
    }
    .author {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: right;
    }
    .author::before { content: '— '; }
    .meaning-toggle {
      display: inline-block;
      margin-top: 20px;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--ink-dim);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .meaning-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .meaning {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--card-border);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-dim);
      font-style: normal;
      animation: fadeIn 0.3s ease-out;
    }
    .meaning strong { color: var(--ink); font-weight: 500; }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--accent);
      color: #1a1410;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -8px rgba(212, 165, 116, 0.6);
    }
    .btn:active { transform: translateY(0); }
    .btn-ghost {
      background: transparent;
      color: var(--ink-dim);
      border: 1px solid var(--card-border);
    }
    .btn-ghost:hover {
      color: var(--ink);
      border-color: var(--accent);
      box-shadow: none;
    }
    .hint {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-dim);
      min-height: 18px;
      transition: opacity 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card.swap { animation: fadeIn 0.4s ease-out; }
    @media (max-width: 560px) {
      .container { padding: 40px 20px 32px; }
      .card { padding: 44px 28px 36px; }
      .quote { font-size: 22px; }
      .brand { font-size: 28px; }
      .quote-mark { font-size: 72px; top: 4px; left: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="date" id="date"></p>
      <h1 class="brand">Cita del día para Gio</h1>
    </header>

    <section class="card" id="card">
      <div class="quote-mark">&ldquo;</div>
      <blockquote class="quote" id="quote">Cargando...</blockquote>
      <p class="author" id="author"></p>
      <button id="toggleMeaning" class="meaning-toggle" hidden>Ver significado</button>
      <div class="meaning" id="meaning" hidden></div>
    </section>

    <footer class="controls">
      <button id="newQuote" class="btn">Otra cita</button>
      <button id="copyQuote" class="btn btn-ghost">Copiar</button>
      <button id="shareQuote" class="btn btn-ghost">Compartir</button>
    </footer>

    <p class="hint" id="hint"></p>
  </main>

  <script>
    const QUOTES = [
      { t: "El hombre es la medida de todas las cosas.", a: "Protágoras", e: "La verdad y el valor no son absolutos: dependen del punto de vista humano que los formula. <strong>En la vida:</strong> antes de imponer tu opinión como verdad universal, pregúntate desde qué experiencia la pronuncias — y reconoce que el otro habla desde la suya." },
      { t: "El asombro es el principio de la filosofía.", a: "Platón", e: "Filosofar empieza cuando algo cotidiano deja de parecer obvio. <strong>En la vida:</strong> conserva la capacidad de extrañarte ante lo que todos dan por sentado — un atardecer, el hecho de existir, la rutina familiar. Ahí nacen las preguntas que importan." },
      { t: "Podemos perdonar a un niño que tiene miedo a la oscuridad; la verdadera tragedia es cuando los hombres tienen miedo a la luz.", a: "Platón", e: "La ignorancia inocente del niño es perdonable; la huida deliberada del conocimiento en el adulto, no. <strong>En la vida:</strong> rechazar pensar, informarse o cuestionarse no es neutralidad — es complicidad con lo que te conviene no saber." },
      { t: "Somos lo que hacemos repetidamente. La excelencia, entonces, no es un acto, sino un hábito.", a: "Aristóteles", e: "El carácter se forma por repetición, no por gestos heroicos aislados. <strong>En la vida:</strong> tu rutina diaria —lo que haces sin pensar— revela quién eres más que tus declaraciones de intención. Para cambiar de carácter hay que cambiar de hábitos, no de discursos." },
      { t: "No podemos bañarnos dos veces en el mismo río.", a: "Heráclito", e: "Tanto el río como tú han cambiado entre baño y baño: ningún instante se repite. <strong>En la vida:</strong> deja de aferrarte a versiones congeladas de las personas o las situaciones. Lo que regresa nunca es exactamente lo mismo que se fue — ni siquiera tú." },
      { t: "Dios ha muerto. Dios sigue muerto. Y nosotros lo hemos matado.", a: "Friedrich Nietzsche", e: "No es una proclamación atea sino un diagnóstico cultural: las grandes certezas que daban sentido (religión, tradición, progreso) han perdido su autoridad. <strong>En la vida:</strong> heredamos la libertad de crear nuestros valores, pero también la responsabilidad de sostenerlos sin un orden cósmico que los garantice." },
      { t: "Aquel que tiene un porqué para vivir, puede soportar casi cualquier cómo.", a: "Friedrich Nietzsche", e: "El sufrimiento es tolerable cuando tiene sentido; insoportable cuando es absurdo. <strong>En la vida:</strong> antes de pelear contra la dificultad de tus circunstancias, pregúntate si tienes claro tu para qué. Sin propósito, el más leve obstáculo agota; con él, casi nada doblega." },
      { t: "Quien lucha con monstruos debe cuidarse de no convertirse a su vez en monstruo.", a: "Friedrich Nietzsche", e: "Combatir el mal con sus mismas armas es la forma más eficaz de reproducirlo. <strong>En la vida:</strong> ten cuidado con los medios que usas contra lo que detestas — el odio justificado tiende a transformarte en aquello que odias. Mira a quien has llegado a parecerte tras años de pelea." },
      { t: "No hay hechos, solo interpretaciones.", a: "Friedrich Nietzsche", e: "Ningún dato llega puro a la mente: siempre lo recibe un marco que lo organiza, lo jerarquiza, lo carga de sentido. <strong>En la vida:</strong> cuando alguien dice «los hechos son los hechos», pregúntate qué interpretación está naturalizando como si fuera neutra." },
      { t: "El hombre está condenado a ser libre.", a: "Jean-Paul Sartre", e: "No podemos no elegir: incluso no decidir es una decisión. La libertad no es un regalo sino una carga ineludible. <strong>En la vida:</strong> no puedes culpar a las circunstancias, a tu pasado o a otros por lo que haces hoy — cada acto es tuyo, incluyendo el de quedarte quieto." },
      { t: "El infierno son los otros.", a: "Jean-Paul Sartre", e: "No es que los otros sean malos: es que su mirada nos cosifica, nos congela en una imagen que no controlamos. <strong>En la vida:</strong> sufres cuando vives pendiente de cómo te ven los demás. La mirada ajena puede ser cárcel, pero también la única forma de saber quién eres. El equilibrio está en no dejar que decida por ti." },
      { t: "Comencé entonces a comprender que el ser humano es el animal que cuenta historias.", a: "Jean-Paul Sartre" },
      { t: "Hay que imaginar a Sísifo dichoso.", a: "Albert Camus", e: "El castigo de Sísifo —empujar la roca cuesta arriba para siempre— es metáfora de la vida absurda. Camus dice: incluso sin sentido cósmico, hay dignidad en aceptar la tarea y entregarse a ella. <strong>En la vida:</strong> la felicidad no exige que el mundo tenga sentido — basta con asumir tu roca y empujarla con plena conciencia." },
      { t: "La vida solo puede ser comprendida mirando hacia atrás, pero ha de ser vivida mirando hacia adelante.", a: "Søren Kierkegaard", e: "El sentido de lo que vivimos solo se ordena cuando ya pasó; pero hay que decidir y actuar antes de tener esa claridad. <strong>En la vida:</strong> esperar a entender antes de decidir es una excusa para no vivir. Avanza con la información imperfecta que tienes ahora; la comprensión llega después." },
      { t: "Atrévete a saber.", a: "Immanuel Kant", e: "Sapere aude — divisa de la Ilustración. Pensar por uno mismo requiere coraje, porque es más cómodo dejar que otros (la autoridad, la tradición, la opinión común) piensen por ti. <strong>En la vida:</strong> la pereza intelectual no es inocente; es una forma de cesión voluntaria de tu libertad." },
      { t: "Obra de tal modo que uses la humanidad siempre como un fin, nunca como un medio.", a: "Immanuel Kant", e: "Cada persona tiene dignidad intrínseca: no se la puede instrumentalizar para fines ajenos. <strong>En la vida:</strong> antes de pedirle algo a alguien, pregúntate si lo tratas como persona o como herramienta. La diferencia entre amor y manipulación, entre cooperación y explotación, está en esa frontera." },
      { t: "La libertad consiste en hacer todo lo que las leyes permiten.", a: "Montesquieu" },
      { t: "El hombre nace libre, y en todas partes se encuentra encadenado.", a: "Jean-Jacques Rousseau", e: "Las cadenas no son naturales: las pone la sociedad —sus normas, jerarquías, expectativas, propiedades. <strong>En la vida:</strong> muchos límites que aceptas como inevitables son convenciones que alguien diseñó. Pregúntate cuáles de tus cadenas son reales y cuáles te las dejaron puestas porque nunca las miraste de frente." },
      { t: "Para conocer al hombre, basta estudiarse a uno mismo; para conocer a los hombres, hay que ir entre ellos.", a: "Jean-Jacques Rousseau" },
      { t: "Toda nuestra dignidad consiste en el pensamiento.", a: "Blaise Pascal", e: "El ser humano es físicamente frágil, pero su capacidad de reflexión lo eleva: sabe que va a morir, y eso ya lo distingue. <strong>En la vida:</strong> tu valor no está en lo que posees ni en lo que produces, sino en tu capacidad de detenerte a pensar lo que vives. No la atrofies." },
      { t: "Mientras esperamos vivir, la vida pasa.", a: "Séneca", e: "Pasamos años posponiéndonos para «cuando termine el proyecto», «cuando los hijos crezcan», «cuando me jubile» — y entre tanto, la vida real ya transcurrió. <strong>En la vida:</strong> el momento que esperas no llegará nunca exactamente como lo imaginas. Vive el plazo intermedio como si fuera el destino, porque lo es." },
      { t: "Quien no ha conocido la adversidad no se conoce a sí mismo.", a: "Séneca", e: "En la comodidad todos parecemos templados; solo la dificultad muestra de qué estamos hechos. <strong>En la vida:</strong> no temas las crisis tanto: son los espejos más fiables que tendrás. Lo que descubras de ti bajo presión es información que ninguna situación fácil te habría dado." },
      { t: "Las personas felices recuerdan el pasado con gratitud, se regocijan en el presente y se enfrentan al futuro sin miedo.", a: "Epicuro", e: "Tres tiempos, tres actitudes: gratitud por lo que fue, disfrute de lo que hay, serenidad sobre lo que vendrá. <strong>En la vida:</strong> revisa cuál de los tres se te ha desordenado. Resentimiento con el pasado, ansiedad por el futuro o desconexión del presente son las tres formas más comunes de no estar." },
      { t: "La muerte no es nada para nosotros, ya que cuando somos, la muerte no está, y cuando la muerte está, ya no somos nosotros.", a: "Epicuro", e: "Tememos a la muerte como si fuéramos a vivirla, pero por definición nunca coincidiremos con ella: o estamos o ya no estamos para sufrirla. <strong>En la vida:</strong> mucho del miedo a morir es miedo proyectado de algo que jamás experimentarás. Lo que sí experimentas es el tiempo que te queda — gástalo." },
      { t: "Solo es útil el conocimiento que nos hace mejores.", a: "Sócrates", e: "Saber por saber no basta: para Sócrates, conocer es un acto moral, no acumulativo. <strong>En la vida:</strong> pregúntate qué te hace mejor lo que aprendes hoy. Si la respuesta es «nada, solo me hace más rápido produciendo lo mismo», es información, no conocimiento." },
      { t: "Lo poco que he aprendido carece de valor, comparado con lo que ignoro y no desespero en aprender.", a: "René Descartes" },
      { t: "Entre estímulo y respuesta hay un espacio. En ese espacio está nuestro poder de elegir nuestra respuesta.", a: "Viktor Frankl", e: "Frankl escribió esto tras sobrevivir a los campos de concentración: incluso allí, lo último que les pudieron quitar era la elección de cómo responder. <strong>En la vida:</strong> reacciona menos, responde más. Ese instante de pausa entre lo que te pasa y lo que haces es la única libertad que nadie te puede arrebatar." },
      { t: "Cuando ya no somos capaces de cambiar una situación, nos encontramos con el desafío de cambiarnos a nosotros mismos.", a: "Viktor Frankl", e: "Hay situaciones irreversibles —duelos, enfermedades, decisiones ya tomadas. Lo que no puede modificarse afuera se modifica adentro. <strong>En la vida:</strong> cuando ya no puedes cambiar los hechos, te queda cambiar la actitud — y eso, lejos de ser un consuelo menor, es el último gesto realmente libre." },
      { t: "La realidad es aquello que, cuando dejas de creer en ello, no desaparece.", a: "Philip K. Dick" },
      { t: "El lector vive mil vidas antes de morir; el hombre que nunca lee vive solo una.", a: "George R. R. Martin" },
      { t: "Un libro debe ser un hacha que rompa el mar helado dentro de nosotros.", a: "Franz Kafka" },
      { t: "La literatura siempre es una expedición a la verdad.", a: "Franz Kafka" },
      { t: "Todos los hombres tienen tres vidas: una pública, una privada y otra secreta.", a: "Gabriel García Márquez" },
      { t: "Lo que se nos da no nos pertenece todavía. Hay que ganarlo.", a: "Hermann Hesse" },
      { t: "La belleza salvará al mundo.", a: "Fiódor Dostoyevski" },
      { t: "Si Dios no existe, todo está permitido.", a: "Fiódor Dostoyevski" },
      { t: "Caminante, no hay camino, se hace camino al andar.", a: "Antonio Machado" },
      { t: "Hoy es siempre todavía.", a: "Antonio Machado" },
      { t: "El que lee mucho y anda mucho, ve mucho y sabe mucho.", a: "Miguel de Cervantes" },
      { t: "La libertad, Sancho, es uno de los más preciosos dones que a los hombres dieron los cielos.", a: "Miguel de Cervantes" },
      { t: "Los que sueñan de día son conscientes de muchas cosas que escapan a los que sueñan solo de noche.", a: "Edgar Allan Poe" },
      { t: "La filosofía es una batalla contra el embrujamiento de nuestra inteligencia por medio del lenguaje.", a: "Ludwig Wittgenstein" },
      { t: "Los límites de mi lenguaje son los límites de mi mundo.", a: "Ludwig Wittgenstein", e: "No puedes pensar lo que no puedes decir. Aprender una palabra nueva no es solo etiquetar algo: es abrir una región del mundo antes inaccesible. <strong>En la vida:</strong> ampliar tu vocabulario —emocional, intelectual, técnico— amplía literalmente lo que puedes experimentar y entender. La pobreza léxica es pobreza de mundo." },
      { t: "De lo que no se puede hablar, hay que callar.", a: "Ludwig Wittgenstein", e: "Cierre del Tractatus: hay experiencias —lo místico, lo ético, lo estético— que el lenguaje proposicional no puede capturar sin traicionarlas. <strong>En la vida:</strong> no todo lo importante se dice. A veces hablar de más sobre algo profundo lo banaliza. El silencio compartido también es comunicación, y a menudo más exacta." },
      { t: "El hombre es un dios cuando sueña y un mendigo cuando reflexiona.", a: "Friedrich Hölderlin" },
      { t: "El que tiene imaginación, con qué facilidad saca de la nada un mundo.", a: "Gustavo Adolfo Bécquer" },
      { t: "La vida es un sueño, y los sueños, sueños son.", a: "Pedro Calderón de la Barca" },
      { t: "Hay más cosas en el cielo y en la tierra, Horacio, de las que sueña tu filosofía.", a: "William Shakespeare" },
      { t: "Sabemos lo que somos, pero no lo que podemos llegar a ser.", a: "William Shakespeare" },
      { t: "El hombre razonable se adapta al mundo; el irrazonable persiste en tratar de adaptar el mundo a sí mismo.", a: "George Bernard Shaw" },
      { t: "Quien se conoce a sí mismo es señor de sí.", a: "Pierre Charron" },
      { t: "Nada grande se ha hecho en el mundo sin pasión.", a: "G. W. F. Hegel", e: "La razón sola no mueve nada: necesita ser encendida por una pasión que la haga actuar. <strong>En la vida:</strong> los proyectos meramente racionales se abandonan al primer obstáculo. Lo que sostiene una obra grande es una pasión, casi un desequilibrio, que la razón solo organiza. Sin algo que te obsesione un poco, no harás nada relevante." },
      { t: "El búho de Minerva alza su vuelo al atardecer.", a: "G. W. F. Hegel", e: "La filosofía siempre llega tarde: solo comprendemos una época cuando ya está terminando. <strong>En la vida:</strong> no esperes entender lo que estás viviendo mientras lo vives. Solo en retrospectiva tendrá forma. Esta paciencia te ahorra ansiedad por exigirte claridad antes de tiempo." },
      { t: "La filosofía es su tiempo aprehendido en pensamientos.", a: "G. W. F. Hegel" },
      { t: "Lo real es racional y lo racional es real.", a: "G. W. F. Hegel" },
      { t: "La historia universal es el progreso en la conciencia de la libertad.", a: "G. W. F. Hegel" },
      { t: "El lenguaje es la casa del ser.", a: "Martin Heidegger", e: "No es que usemos el lenguaje: el lenguaje nos habita y configura cómo aparecen las cosas para nosotros. <strong>En la vida:</strong> el modo en que nombras tu experiencia la construye. Llamar a algo «fracaso» o «aprendizaje», «trabajo» o «vocación», no describe — instituye. Cuida tus palabras: son los muros del cuarto donde vives." },
      { t: "Solo un Dios puede aún salvarnos.", a: "Martin Heidegger" },
      { t: "El hombre habita poéticamente la tierra.", a: "Martin Heidegger" },
      { t: "La pregunta por el ser cae hoy en el olvido.", a: "Martin Heidegger" },
      { t: "Pensar es agradecer.", a: "Martin Heidegger", e: "En alemán, «pensar» (Denken) y «agradecer» (Danken) tienen raíz común. Para Heidegger, el pensamiento auténtico es respuesta de gratitud a lo que se nos da: el ser, el mundo, los otros. <strong>En la vida:</strong> el opuesto del pensamiento no es la ignorancia, sino la ingratitud — dar todo por sentado. Quien agradece, piensa." },
      { t: "Cada uno es lo que persigue.", a: "Martin Heidegger" },
      { t: "El carácter del hombre es su destino.", a: "Heráclito" },
      { t: "La naturaleza ama ocultarse.", a: "Heráclito" },
      { t: "La guerra es el padre de todas las cosas y el rey de todo.", a: "Heráclito" },
      { t: "El camino hacia arriba y el camino hacia abajo son uno y el mismo.", a: "Heráclito" },
      { t: "Los que están despiertos tienen un mundo único y común; los que duermen se vuelven cada uno a su propio mundo.", a: "Heráclito" },
      { t: "Solo la comunicación comunica.", a: "Niklas Luhmann" },
      { t: "Lo que sabemos sobre nuestra sociedad, e incluso sobre el mundo en que vivimos, lo sabemos a través de los medios de comunicación de masas.", a: "Niklas Luhmann" },
      { t: "La sociedad no se compone de seres humanos, se compone de comunicaciones.", a: "Niklas Luhmann" },
      { t: "Quien quiera conocer la verdad sobre la sociedad debe contar con su complejidad.", a: "Niklas Luhmann" },
      { t: "El amor no es un sentimiento, sino un código de comunicación según cuyas reglas se expresan, se forman y se simulan sentimientos.", a: "Niklas Luhmann" },
      { t: "Todo lo que se dice, lo dice un observador a otro observador.", a: "Niklas Luhmann" },
      { t: "El sentido es la unidad de la diferencia entre actualidad y posibilidad.", a: "Niklas Luhmann" },
      { t: "La confianza es un mecanismo de reducción de la complejidad social.", a: "Niklas Luhmann" },

      { t: "En medio del camino de nuestra vida me encontré por una selva oscura, porque la recta vía era perdida.", a: "Dante Alighieri, Divina Comedia (c. 1320)" },
      { t: "Cuando abril con sus dulces aguaceros ha penetrado la sequía de marzo hasta la raíz, y bañado cada vena en aquel licor cuya virtud engendra la flor, peregrinos van.", a: "Geoffrey Chaucer, Cuentos de Canterbury (c. 1387)" },
      { t: "Nuestras vidas son los ríos que van a dar en la mar, que es el morir; allí van los señoríos derechos a se acabar y consumir.", a: "Jorge Manrique, Coplas por la muerte de su padre (c. 1476)" },
      { t: "En tanto que de rosa y azucena se muestra la color en vuestro gesto, y que vuestro mirar, ardiente, honesto, enciende al corazón y lo refrena… Coged de vuestra alegre primavera el dulce fruto antes que el tiempo airado cubra de nieve la hermosa cumbre.", a: "Garcilaso de la Vega, Soneto XXIII (c. 1543)" },
      { t: "En una noche oscura, con ansias en amores inflamada, ¡oh dichosa ventura!, salí sin ser notada, estando ya mi casa sosegada.", a: "San Juan de la Cruz, Noche oscura (c. 1578)" },
      { t: "Ningún hombre es una isla entera por sí mismo; cada hombre es una pieza del continente, una parte del todo. La muerte de cualquier hombre me disminuye, porque estoy ligado a la humanidad; y por eso nunca preguntes por quién doblan las campanas: doblan por ti.", a: "John Donne, Meditación XVII (1624)" },
      { t: "¿Te compararé a un día de verano? Tú eres más adorable y más templado: vientos rudos sacuden los capullos de mayo, y el estío termina antes de lo esperado.", a: "William Shakespeare, Soneto XVIII (1609)" },
      { t: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme, vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor. Se enfrascó tanto en la lectura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio; y así, del poco dormir y del mucho leer, se le secó el cerebro, de manera que vino a perder el juicio.", a: "Miguel de Cervantes, Don Quijote (1605)" },
      { t: "Alma a quien todo un dios prisión ha sido, venas que humor a tanto fuego han dado, médulas que han gloriosamente ardido: su cuerpo dejará, no su cuidado; serán ceniza, mas tendrá sentido; polvo serán, mas polvo enamorado.", a: "Francisco de Quevedo, Amor constante más allá de la muerte (c. 1648)" },
      { t: "¿Qué es la vida? Un frenesí. ¿Qué es la vida? Una ilusión, una sombra, una ficción, y el mayor bien es pequeño; que toda la vida es sueño, y los sueños, sueños son.", a: "Pedro Calderón de la Barca, La vida es sueño (1635)" },
      { t: "Hombres necios que acusáis a la mujer sin razón, sin ver que sois la ocasión de lo mismo que culpáis.", a: "Sor Juana Inés de la Cruz, Hombres necios (c. 1689)" },
      { t: "De la primera desobediencia del hombre, y del fruto de aquel árbol prohibido cuyo bocado mortal trajo al mundo la muerte, canta, musa celestial.", a: "John Milton, El paraíso perdido (1667)" },
      { t: "Es una verdad universalmente reconocida que un hombre soltero, poseedor de una gran fortuna, necesita esposa. Por poco conocidos que sean los sentimientos u opiniones de un hombre así, esta verdad está tan arraigada en las mentes de las familias del vecindario, que se le considera propiedad legítima de alguna de sus hijas.", a: "Jane Austen, Orgullo y prejuicio (1813)" },
      { t: "Llamadme Ismael. Hace unos años, no importa cuántos exactamente, teniendo poco o ningún dinero en el bolsillo y nada en particular que me interesara en tierra, pensé que me haría a la mar y vería la parte acuosa del mundo. Es un modo que tengo de espantar la melancolía y arreglar la circulación.", a: "Herman Melville, Moby Dick (1851)" },
      { t: "Era el mejor de los tiempos, era el peor de los tiempos, era la edad de la sabiduría, era la edad de la locura, era la época de la fe, era la época de la incredulidad, era la estación de la Luz, era la estación de las Tinieblas, era la primavera de la esperanza, era el invierno de la desesperación.", a: "Charles Dickens, Historia de dos ciudades (1859)" },
      { t: "Todas las familias felices se parecen, pero cada familia infeliz lo es a su manera.", a: "León Tolstói, Ana Karénina (1877)" },
      { t: "Es el Aburrimiento. Los ojos cargados de un llanto involuntario, sueña con cadalsos mientras fuma su pipa. Tú lo conoces, lector, ese monstruo delicado: ¡hipócrita lector, mi semejante, mi hermano!", a: "Charles Baudelaire, Las flores del mal (1857)" },
      { t: "Volverán las oscuras golondrinas en tu balcón sus nidos a colgar, y otra vez con el ala a sus cristales jugando llamarán; pero aquellas que el vuelo refrenaban tu hermosura y mi dicha al contemplar, ¡esas no volverán!", a: "Gustavo Adolfo Bécquer, Rima LIII (1871)" },
      { t: "Y el cuervo, sin alzar el vuelo, sigue inmóvil sobre el pálido busto de Palas que hay sobre mi puerta; y sus ojos tienen el aspecto de un demonio que sueña, y la luz al proyectar su sombra sobre el suelo, mi alma, de esa sombra que allí flota, no podrá librarse jamás. «Nunca más.»", a: "Edgar Allan Poe, El cuervo (1845)" },
      { t: "Un golpe de dados jamás abolirá el azar.", a: "Stéphane Mallarmé, Un golpe de dados (1897)" },
      { t: "Yo soy aquel que ayer no más decía el verso azul y la canción profana, en cuya noche un ruiseñor había que era alondra de luz por la mañana.", a: "Rubén Darío, Cantos de vida y esperanza (1905)" },
      { t: "Cuando Gregorio Samsa se despertó una mañana después de un sueño intranquilo, se encontró sobre su cama convertido en un monstruoso insecto.", a: "Franz Kafka, La metamorfosis (1915)" },
      { t: "Durante mucho tiempo me acosté temprano. A veces, apenas había apagado la vela, mis ojos se cerraban tan deprisa que ni siquiera tenía tiempo de decirme: «Me estoy durmiendo». Y media hora después me despertaba la idea de que ya era hora de buscar el sueño.", a: "Marcel Proust, En busca del tiempo perdido (1913)" },
      { t: "Vamos entonces, tú y yo, cuando la tarde se extiende contra el cielo como un paciente anestesiado sobre una mesa.", a: "T. S. Eliot, La canción de amor de J. Alfred Prufrock (1915)" },
      { t: "Hay golpes en la vida, tan fuertes… ¡Yo no sé! Golpes como del odio de Dios; como si ante ellos, la resaca de todo lo sufrido se empozara en el alma… ¡Yo no sé!", a: "César Vallejo, Los heraldos negros (1919)" },
      { t: "y entonces le pedí con los ojos que me lo pidiera otra vez sí y entonces él me preguntó si quería sí decir sí mi flor de la montaña y primero le rodeé con mis brazos sí y le atraje hacia mí para que pudiera sentir mis pechos todo perfume sí y su corazón parecía enloquecido y sí dije sí quiero Sí.", a: "James Joyce, Ulises (1922)" },
      { t: "Puedo escribir los versos más tristes esta noche. Escribir, por ejemplo: «La noche está estrellada, y tiritan, azules, los astros, a lo lejos».", a: "Pablo Neruda, Veinte poemas de amor (1924)" },
      { t: "La señora Dalloway dijo que ella misma compraría las flores. Pues Lucy ya tenía bastante trabajo. Habría que desmontar las puertas; vendrían los hombres de Rumpelmayer. Y entonces, pensó Clarissa Dalloway, ¡qué mañana, fresca como entregada a niños en la playa!", a: "Virginia Woolf, La señora Dalloway (1925)" },
      { t: "Verde que te quiero verde. Verde viento. Verdes ramas. El barco sobre la mar y el caballo en la montaña.", a: "Federico García Lorca, Romance sonámbulo (1928)" },
      { t: "Hoy ha muerto mamá. O quizá ayer, no sé. Recibí un telegrama del asilo: «Madre fallecida. Entierro mañana. Sentido pésame.» Pero no quiere decir nada. Quizá haya sido ayer.", a: "Albert Camus, El extranjero (1942)" },
      { t: "Era un día luminoso y frío de abril, y los relojes daban las trece. Winston Smith, con la barbilla hundida en el pecho en un esfuerzo por escapar al viento maligno, se deslizó rápidamente por las puertas de cristal de las Casas de la Victoria, aunque no con la suficiente rapidez como para impedir que una ráfaga de polvo arenoso entrara con él.", a: "George Orwell, 1984 (1949)" },
      { t: "Lolita, luz de mi vida, fuego de mis entrañas. Pecado mío, alma mía. Lo-li-ta: la punta de la lengua emprende un viaje de tres pasos paladar abajo hasta apoyarse, en el tercero, en el borde de los dientes. Lo. Li. Ta.", a: "Vladimir Nabokov, Lolita (1955)" },
      { t: "Vine a Comala porque me dijeron que acá vivía mi padre, un tal Pedro Páramo.", a: "Juan Rulfo, Pedro Páramo (1955)" },
      { t: "Hay una hora del atardecer en que la llanura está por decir algo; nunca lo dice, o tal vez lo dice infinitamente y no lo entendemos, o lo entendemos pero es intraducible como una música.", a: "Jorge Luis Borges, El fin (1956)" },
      { t: "¿Encontraría a la Maga? Tantas veces me había bastado asomarme, viniendo por la rue de Seine, al arco que da al Quai de Conti, y apenas la luz de ceniza y olivo que flota sobre el río me dejaba distinguir las formas, ya su silueta delgada se inscribía en el Pont des Arts.", a: "Julio Cortázar, Rayuela (1963)" },
      { t: "Muchos años después, frente al pelotón de fusilamiento, el coronel Aureliano Buendía había de recordar aquella tarde remota en que su padre lo llevó a conocer el hielo.", a: "Gabriel García Márquez, Cien años de soledad (1967)" },
      { t: "No soy nada. Nunca seré nada. No puedo querer ser nada. Aparte de eso, llevo en mí todos los sueños del mundo.", a: "Fernando Pessoa, Libro del desasosiego (1982)" },
      { t: "No nos quedamos ciegos, creo que estamos ciegos. Ciegos que ven. Ciegos que, viendo, no ven. Cuando los ciegos lloran, tienen los ojos abiertos.", a: "José Saramago, Ensayo sobre la ceguera (1995)" },
      { t: "La primera vez que Jean-Claude Pelletier leyó a Benno von Archimboldi fue en la Navidad de 1980, en París, donde cursaba estudios universitarios de literatura alemana, a la edad de diecinueve años.", a: "Roberto Bolaño, 2666 (2004)" },
      { t: "Antes de que mi mujer se hiciera vegetariana, yo siempre la consideré completamente vulgar. La elegí precisamente porque no me atraía. Sin un encanto destacable, sin defectos importantes ni virtudes especiales, parecía una mujer normal. Pero, por algún motivo, desde aquel día empezó a soñar.", a: "Han Kang, La vegetariana (2007)" },
      { t: "Para el corazón, la vida es simple: late mientras pueda. Luego se detiene. Tarde o temprano, un día, este movimiento de bombeo cesará por su cuenta y la sangre comenzará a fluir hacia el punto más bajo del cuerpo, donde se acumulará en una pequeña charca.", a: "Karl Ove Knausgård, Mi lucha (2009)" },

      { t: "El loco no es el hombre que ha perdido la razón. El loco es el hombre que lo ha perdido todo menos la razón.", a: "G. K. Chesterton" },
      { t: "La tradición es la democracia de los muertos: rehúsa someterse a la pequeña y arrogante oligarquía de quienes simplemente andan por ahí.", a: "G. K. Chesterton" },
      { t: "Los cuentos de hadas no enseñan a los niños que los dragones existen: los niños ya saben que los dragones existen. Les enseñan que pueden ser vencidos.", a: "G. K. Chesterton" },
      { t: "El periodismo consiste, en gran parte, en decir «Lord Jones ha muerto» a gente que ni siquiera sabía que Lord Jones estaba vivo.", a: "G. K. Chesterton" },
      { t: "Si una cosa vale la pena de hacerse, vale la pena de hacerse mal.", a: "G. K. Chesterton" },
      { t: "El verdadero soldado no lucha porque odie lo que tiene delante, sino porque ama lo que tiene detrás.", a: "G. K. Chesterton" },
      { t: "La gratitud es la madre de todas las virtudes, y la más alta forma del pensamiento.", a: "G. K. Chesterton" },
      { t: "Una aventura no es más que una incomodidad correctamente considerada; una incomodidad no es más que una aventura mal considerada.", a: "G. K. Chesterton" },

      { t: "Me celebro y me canto a mí mismo, y lo que yo asumo tú lo asumirás, pues cada átomo que me pertenece, también te pertenece a ti.", a: "Walt Whitman, Canto de mí mismo (1855)" },
      { t: "¿Que me contradigo? Pues sí, me contradigo. Soy amplio, contengo multitudes.", a: "Walt Whitman, Canto de mí mismo (1855)" },
      { t: "Resiste mucho, obedece poco.", a: "Walt Whitman, A los Estados (1860)" },
      { t: "¡Oh capitán, mi capitán! Nuestro espantoso viaje ha terminado, el barco ha capeado los escollos, hemos ganado el premio anhelado.", a: "Walt Whitman, ¡Oh capitán, mi capitán! (1865)" },
      { t: "No te detengas. No te despidas. No me digas adiós sin decirme antes que la vida es así, una despedida.", a: "Walt Whitman" },
      { t: "Sé curioso, no juzgues. Mira con tus propios ojos.", a: "Walt Whitman" },
      { t: "No hay fuera-de-texto.", a: "Jacques Derrida, De la gramatología (1967)" },
      { t: "La justicia es indeconstruible: la deconstrucción es justicia.", a: "Jacques Derrida, Fuerza de ley (1989)" },
      { t: "La diferencia, la différance, no es ni una palabra ni un concepto.", a: "Jacques Derrida, Márgenes de la filosofía (1972)" },
      { t: "No tenemos más que un solo lenguaje, y no es el nuestro.", a: "Jacques Derrida, El monolingüismo del otro (1996)" },
      { t: "La hospitalidad absoluta exige que abra mi casa al otro absolutamente desconocido y le dé lugar sin pedirle ni reciprocidad ni siquiera su nombre.", a: "Jacques Derrida, De la hospitalidad (1997)" },
      { t: "Una habitación sin libros es como un cuerpo sin alma.", a: "Cicerón" },
      { t: "Vivir es pensar.", a: "Cicerón, Tusculanas (c. 45 a. C.)" },
      { t: "El no saber lo que ha sucedido antes de nosotros es ser siempre un niño.", a: "Cicerón, El orador (46 a. C.)" },
      { t: "El extremo rigor del derecho es extrema injusticia.", a: "Cicerón, De los deberes (44 a. C.)" },
      { t: "¡Oh tiempos, oh costumbres!", a: "Cicerón, Catilinarias (63 a. C.)" },
      { t: "El rostro es el espejo del alma, y los ojos, sus intérpretes.", a: "Cicerón, El orador (46 a. C.)" },
      { t: "No hay nada tan absurdo que no haya sido dicho por algún filósofo.", a: "Cicerón, De la adivinación (44 a. C.)" },
      { t: "La amistad hace que la prosperidad sea más brillante, y aligera la adversidad dividiéndola y compartiéndola.", a: "Cicerón, De la amistad (44 a. C.)" },

      { t: "Si te aflige algo externo, no es ese algo lo que te perturba, sino tu propio juicio sobre ello; y está en tu poder borrarlo ahora.", a: "Marco Aurelio, Meditaciones VIII, 47 (c. 175)", e: "El dolor de un suceso depende menos del suceso que de la interpretación que le aplicas. <strong>En la vida:</strong> entre estímulo y reacción hay un juicio, y ese juicio es tuyo. Cambiarlo no elimina el hecho, pero sí su peso emocional — y es lo único en lo que tienes poder directo." },
      { t: "El alma se tiñe con el color de sus pensamientos.", a: "Marco Aurelio, Meditaciones V, 16 (c. 175)", e: "Te conviertes en aquello que rumias. Pensar repetidamente algo —rencores, miedos, envidias— termina coloreando todo lo que percibes. <strong>En la vida:</strong> elige con cuidado a qué le dedicas tu monólogo interno; con el tiempo, ese monólogo se vuelve tu carácter." },
      { t: "Comienza la mañana diciéndote a ti mismo: hoy me encontraré con gente entrometida, ingrata, arrogante, deshonesta, celosa y agria. Y, sin embargo, son mis hermanos.", a: "Marco Aurelio, Meditaciones II, 1 (c. 175)", e: "Es la praemeditatio malorum estoica: anticipar lo difícil para no quedar a merced de su sorpresa. Reconocer la humanidad común no excusa el mal, pero impide deshumanizar al otro. <strong>En la vida:</strong> no esperes que el día sea fácil; ensaya cómo vas a responder cuando no lo sea." },
      { t: "Lo que se interpone en el camino se convierte en el camino.", a: "Marco Aurelio, Meditaciones V, 20 (c. 175)", e: "El obstáculo no es una desviación del camino: es el camino. Lo que parece bloquearte es, en realidad, lo que te exige crecer. <strong>En la vida:</strong> cada dificultad contiene la forma exacta de la lección que necesitas. Sortearla no la elimina; atravesarla la convierte en aprendizaje." },
      { t: "El mejor modo de vengarte de tus enemigos es no parecerte a ellos.", a: "Marco Aurelio, Meditaciones VI, 6 (c. 175)", e: "La venganza ordinaria te hunde al nivel del que te ofendió. La verdadera victoria está en mantener tu carácter intacto. <strong>En la vida:</strong> cuando alguien te trata mal, la tentación es responder en el mismo registro. Resistirla no es debilidad — es la única forma de no entregarle también tu integridad." },
      { t: "Vives solamente ahora, en este momento fugaz. Todo lo demás o ya pasó o es incierto.", a: "Marco Aurelio, Meditaciones III, 10 (c. 175)", e: "Solo posees el instante presente; el pasado ya no es tuyo y el futuro aún no existe. <strong>En la vida:</strong> no puedes perder lo que no tienes — ni el ayer ni el mañana. Solo puedes perder el ahora, y solo si no lo habitas. La mayoría de las preocupaciones son visitas a tiempos que no existen." },
      { t: "Acepta las cosas a las que el destino te ata, y ama a las personas con las que el destino te une, pero hazlo con todo tu corazón.", a: "Marco Aurelio, Meditaciones VI, 39 (c. 175)", e: "Amor fati: amar lo que la vida te trae en vez de pelearte con ello. No es resignación pasiva sino entrega activa. <strong>En la vida:</strong> mucho de tu agotamiento viene de querer que la realidad sea distinta de lo que es. Acepta lo dado, pero acéptalo plenamente — la entrega tibia agota más que la entrega total." },
      { t: "Pronto habrás olvidado todas las cosas; y todas las cosas pronto te habrán olvidado a ti.", a: "Marco Aurelio, Meditaciones VII, 21 (c. 175)", e: "La impermanencia es total: no solo te morirás, también te olvidarán. Lo escribió el emperador más poderoso del mundo. <strong>En la vida:</strong> es liberador, no deprimente. Si nada de lo que hagas será recordado en mil años, ¿qué urgencia tiene el qué dirán de hoy? Vive más ligero." },

      { t: "Una vida no examinada no merece ser vivida.", a: "Sócrates (Apología, 399 a. C.)", e: "Sócrates dijo esto en su juicio, prefiriendo la muerte a renunciar a cuestionarse. Vivir sin reflexión es funcionar, no vivir. <strong>En la vida:</strong> dedicar tiempo regular a revisar lo que haces y por qué no es un lujo intelectual — es lo que separa una biografía de una agenda." },
      { t: "Solo sé que no sé nada.", a: "Sócrates (atribución platónica)", e: "Reconocer la propia ignorancia es el comienzo de la sabiduría: el necio cree saber y se cierra; el sabio sabe que no sabe y se mantiene abierto. <strong>En la vida:</strong> desconfía de tu certeza más firme. Las personas más interesantes son las que aún hacen preguntas; las más rígidas, las que ya tienen todas las respuestas." },
      { t: "Conócete a ti mismo.", a: "Sócrates (oráculo de Delfos)", e: "Antes de buscar conocer el mundo, conoce el instrumento con el que lo miras: tú. Tus sesgos, miedos, deseos y heridas filtran toda percepción. <strong>En la vida:</strong> sin autoconocimiento no hay decisión libre — solo reacciones automáticas a tu propia historia no procesada." },
      { t: "El cuerpo es la cárcel del alma.", a: "Platón, Fedón (c. 380 a. C.)" },
      { t: "Aprender no es otra cosa que recordar.", a: "Platón, Menón (c. 385 a. C.)" },
      { t: "Los que filosofan rectamente se ejercitan en morir.", a: "Platón, Fedón (c. 380 a. C.)" },
      { t: "El hombre es por naturaleza un animal político.", a: "Aristóteles, Política I (c. 335 a. C.)" },
      { t: "La virtud es un término medio entre dos vicios, el uno por exceso y el otro por defecto.", a: "Aristóteles, Ética a Nicómaco II (c. 340 a. C.)" },
      { t: "El amigo es otro yo.", a: "Aristóteles, Ética a Nicómaco IX (c. 340 a. C.)" },
      { t: "Todos los hombres por naturaleza desean saber.", a: "Aristóteles, Metafísica I (c. 350 a. C.)" },
      { t: "Pienso, luego existo.", a: "René Descartes, Discurso del método (1637)", e: "Buscando un cimiento indudable, Descartes nota que incluso al dudar de todo, hay alguien dudando. La existencia se afirma en el acto mismo de pensar. <strong>En la vida:</strong> bajo cualquier crisis de identidad o de mundo, queda un núcleo: el «yo que piensa» esto. Esa es la base más sólida que tienes." },
      { t: "Para examinar la verdad, es preciso, una vez en la vida, poner en duda todas las cosas en cuanto sea posible.", a: "René Descartes, Principios de la filosofía (1644)", e: "La duda metódica: someter cada creencia heredada a examen para conservar solo lo que sobrevive a la crítica. <strong>En la vida:</strong> una vez al menos, revisa de dónde sacaste tus ideas más firmes — sobre la familia, el trabajo, lo que «se hace». Muchas no son tuyas, solo nunca las cuestionaste." },
      { t: "El hombre es una caña, la más débil de la naturaleza; pero es una caña pensante.", a: "Blaise Pascal, Pensamientos, fr. 200 (1670)", e: "Físicamente somos frágiles: una gota de agua, una piedra, basta para matarnos. Pero sabemos que nos matan, y el universo no sabe que nos mata. <strong>En la vida:</strong> tu fragilidad no es debilidad — es la condición misma de tu conciencia. Lo que te mata no te entiende; tú sí." },
      { t: "Si Dios existe, lo ganamos todo; si no existe, no perdemos nada. Apuesta entonces sin titubear que existe.", a: "Blaise Pascal, Pensamientos, fr. 233 (1670)", e: "La famosa apuesta de Pascal: ante la incertidumbre absoluta sobre Dios, el cálculo racional favorece creer. <strong>En la vida:</strong> más allá del tema religioso, es un modelo de decisión bajo incertidumbre: cuando no puedes saber, calcula qué pierdes y qué ganas con cada opción y elige la asimetría favorable." },
      { t: "Toda la desgracia de los hombres procede de una sola cosa: no saber estar tranquilo en una habitación.", a: "Blaise Pascal, Pensamientos, fr. 139 (1670)", e: "El ser humano huye del silencio porque le obliga a encontrarse consigo mismo. Por eso busca constantemente distracciones: trabajo, ruido, pantallas, viajes. <strong>En la vida:</strong> si no puedes estar a solas contigo media hora sin agitarte, lo que estás evitando no es el aburrimiento — eres tú." },
      { t: "La angustia es el vértigo de la libertad.", a: "Søren Kierkegaard, El concepto de la angustia (1844)", e: "Frente a un abismo, no temes caer: temes querer saltar. La angustia surge al descubrir que puedes elegir cualquier cosa. <strong>En la vida:</strong> mucho de tu malestar no viene de no poder hacer algo, sino de la conciencia abrumadora de que podrías hacer demasiadas cosas. La libertad real da miedo." },
      { t: "La verdad es subjetividad.", a: "Søren Kierkegaard, Postscriptum no científico (1846)", e: "Hay verdades que solo existen cuando alguien las asume con su existencia entera — no basta con conocerlas, hay que vivirlas. <strong>En la vida:</strong> repetir una idea correcta sin que te transforme es falsa sabiduría. Lo que sabes pero no encarnas, no lo sabes realmente." },
      { t: "El mayor peligro, perderse a uno mismo, puede pasar en el mundo tan en silencio como si nada fuera.", a: "Søren Kierkegaard, La enfermedad mortal (1849)", e: "Perder un objeto, una casa, un trabajo, son pérdidas ruidosas. Perderse a uno mismo es callado: sucede año tras año por mil cesiones pequeñas. <strong>En la vida:</strong> revisa qué has dejado en el camino para ser aceptado, productivo o invisible. La autotraición rara vez es un acto único; es una erosión lenta." },

      { t: "Nos hiciste, Señor, para ti, y nuestro corazón está inquieto hasta que descanse en ti.", a: "San Agustín, Confesiones I, 1 (397-400)" },
      { t: "Tarde te amé, hermosura tan antigua y tan nueva, tarde te amé. Tú estabas dentro de mí, y yo fuera, y por fuera te buscaba.", a: "San Agustín, Confesiones X, 27 (397-400)" },
      { t: "¿Qué es, pues, el tiempo? Si nadie me lo pregunta, lo sé; pero si quiero explicárselo al que me lo pregunta, no lo sé.", a: "San Agustín, Confesiones XI, 14 (397-400)" },
      { t: "Los hombres salen a admirar la altura de las montañas, las inmensas olas del mar, las anchurosas corrientes de los ríos, la vastedad del océano, los giros de las estrellas, y se olvidan de sí mismos.", a: "San Agustín, Confesiones X, 8 (397-400)" },
      { t: "Dame castidad y continencia, Señor, pero no todavía.", a: "San Agustín, Confesiones VIII, 7 (397-400)" },
      { t: "No salgas fuera, vuelve a ti mismo: en el hombre interior habita la verdad.", a: "San Agustín, De vera religione XXXIX, 72 (390)" },
      { t: "Ama, y haz lo que quieras.", a: "San Agustín, Tratado sobre la Primera epístola de Juan VII, 8 (407)" },
      { t: "La fe es creer lo que no se ve, y la recompensa de esta fe es ver lo que se cree.", a: "San Agustín, Sermón 43, 9 (c. 410)" },
      { t: "Dos amores fundaron dos ciudades: el amor de sí mismo hasta el desprecio de Dios fundó la ciudad terrena; el amor de Dios hasta el desprecio de sí mismo fundó la ciudad celestial.", a: "San Agustín, La ciudad de Dios XIV, 28 (413-426)" },
      { t: "El alma vive más allí donde ama que allí donde anima.", a: "San Agustín, Epístola 137 (412)" },

      { t: "Esculpir el tiempo: eso es lo que distingue al cine de todas las demás artes. El director trabaja con bloques de tiempo, como el escultor trabaja con el mármol: corta lo superfluo y deja la duración exacta que cada plano necesita para respirar.", a: "Andrei Tarkovsky, Esculpir en el tiempo (1986)" },
      { t: "Una imagen no expresa una idea: encierra el sentimiento del mundo. El arte no piensa lógicamente; expresa su propio postulado de fe.", a: "Andrei Tarkovsky, Esculpir en el tiempo (1986)" },
      { t: "El propósito del arte no es enseñar al hombre cómo vivir, sino prepararlo para vivir conmoviéndolo profundamente, capaz de orientarse hacia el bien.", a: "Andrei Tarkovsky, Esculpir en el tiempo (1986)" },
      { t: "El teatro es como una esposa fiel; el cine, la gran aventura, la amante extravagante y costosa. Al teatro vuelves siempre y conoces sus rincones; al cine te entregas con miedo, porque cada película puede ser la última, y porque devora dinero, nervios y años como ninguna otra forma de arte.", a: "Ingmar Bergman, Linterna mágica (1987)" },
      { t: "Ningún arte traspasa la conciencia humana como lo hace el cine, directamente, hasta nuestros sentimientos, profundamente, en las cámaras oscuras del alma.", a: "Ingmar Bergman, El séptimo sello (sobre el cine, 1957)" },
      { t: "La única manera real de ser realista es ser un visionario. El neorrealismo se equivoca al pensar que basta con filmar la calle: la realidad no está en la superficie de las cosas, sino en la mirada que las atraviesa. Sin imaginación, lo real desaparece.", a: "Federico Fellini" },
      { t: "Hablamos un lenguaje distinto al de la palabra escrita: el cine es una manera nueva de escribir, y en cierto modo, la forma del pensamiento del siglo XX.", a: "Federico Fellini" },
      { t: "Si se puede hablar de algo, eso ya no es cine: es teatro o literatura. La fuerza del cine reside en lo que se ve, no en lo que se dice. Una imagen bien construida no necesita explicación: el espectador la entiende con todo el cuerpo antes de que su mente la traduzca a palabras.", a: "Stanley Kubrick" },
      { t: "El drama es la vida con las partes aburridas eliminadas. El cine es eso: vida sin los tiempos muertos. Pero el suspense no nace de mostrar la explosión, sino de la espera bajo la mesa: el espectador sabe lo que el personaje ignora, y ese desfase de información es el motor de la emoción.", a: "Alfred Hitchcock" },
      { t: "El cine es la verdad veinticuatro veces por segundo. La cámara no copia la realidad: la decide. Cada fotograma es una elección sobre qué entra en el cuadro y qué queda fuera, y entre fotograma y fotograma se cuela el mundo entero.", a: "Jean-Luc Godard, El soldadito (1963)" },
      { t: "Una historia debe tener un principio, un desarrollo y un final, pero no necesariamente en ese orden. Romper la cronología no es un capricho formal: es reconocer que la memoria, el deseo y el pensamiento humanos tampoco avanzan en línea recta.", a: "Jean-Luc Godard" },
      { t: "Necesitamos imágenes que estén a la altura de nuestra civilización, imágenes que correspondan a nuestra alma más profunda. Sin imágenes nuevas no sobreviviremos.", a: "Werner Herzog, Minnesota Declaration (1999)" },
      { t: "El modelo no actúa: es. Mecanizado por fuera, intacto por dentro. No uso actores profesionales: el actor representa, el modelo simplemente está. Le quito gestos, énfasis, intenciones; lo que queda, depurado, es la verdad del rostro.", a: "Robert Bresson, Notas sobre el cinematógrafo (1975)" },
      { t: "Hacer sentir lo que escribes, no hacerlo entender. El cinematógrafo no es teatro filmado: el espectador no debe seguir un argumento, debe atravesar una experiencia. La emoción precede a la idea; la idea, si llega, llega después.", a: "Robert Bresson, Notas sobre el cinematógrafo (1975)" },
      { t: "El montaje no es una idea compuesta por planos sucesivos puestos uno tras otro: es una idea que nace de la colisión de dos planos independientes. Plano A más plano B no produce A+B, sino un tercer significado que no está en ninguno de los dos: el sentido nace en el corte, en la mente del espectador.", a: "Serguéi Eisenstein, El sentido del cine (1942)" },
      { t: "Ser artista significa no tener miedo de fracasar. La diferencia entre el éxito y el fracaso es perseverar un instante más.", a: "Akira Kurosawa, Algo parecido a una autobiografía (1982)" },
      { t: "Escribimos historia con la luz. La luz no ilumina la escena: la piensa, la siente, decide qué se ve y qué se calla.", a: "Vittorio Storaro" },
      { t: "Las imágenes han dejado de ser inocentes. Hoy ya nadie ve por primera vez: cada mirada está atravesada por todas las miradas anteriores.", a: "Wim Wenders" },
      { t: "Los niños entienden intuitivamente que el mundo está lleno de cosas que ellos no saben. Por eso el cine para niños debe respetar ese asombro, no traicionarlo con explicaciones.", a: "Hayao Miyazaki" },
      { t: "Trabajamos en la oscuridad para servir a la luz. La fotografía es el arte de contar lo que la palabra no puede.", a: "Roger Deakins" },

      { t: "No es por la benevolencia del carnicero, del cervecero o del panadero que esperamos nuestra cena, sino por la consideración de su propio interés. Nos dirigimos no a su humanidad sino a su egoísmo, y nunca les hablamos de nuestras necesidades sino de las ventajas que obtendrán.", a: "Adam Smith, La riqueza de las naciones (1776)" },
      { t: "Cada individuo, buscando su propio interés, es conducido por una mano invisible a promover un fin que no entraba en sus intenciones: el bien común. Persiguiendo su provecho personal, frecuentemente promueve el de la sociedad más eficazmente que si pretendiera promoverlo deliberadamente.", a: "Adam Smith, La riqueza de las naciones (1776)" },
      { t: "Los del mismo oficio raramente se reúnen, ni siquiera para entretenimiento o diversión, sin que la conversación termine en una conspiración contra el público o en alguna estratagema para subir los precios. El mercado necesita reglas precisamente porque sus actores tienden a coordinarse contra él.", a: "Adam Smith, La riqueza de las naciones (1776)" },
      { t: "Bajo un sistema de comercio perfectamente libre, cada país dedica su capital y su trabajo a los empleos que le son más beneficiosos. Aun cuando un país sea menos eficiente en todo, le conviene especializarse en aquello donde su desventaja sea menor: la ventaja comparativa, no la absoluta, es lo que rige el comercio.", a: "David Ricardo, Principios de economía política (1817)" },
      { t: "Las leyes de la producción de la riqueza tienen el carácter de verdades físicas: no hay nada de opcional ni de arbitrario en ellas. No ocurre lo mismo con la distribución de la riqueza, que es asunto exclusivo de las instituciones humanas. Lo que se produce está sujeto a la naturaleza; lo que se reparte, a las leyes que la sociedad elige.", a: "John Stuart Mill, Principios de economía política (1848)" },
      { t: "En la esfera económica, un acto, una costumbre, una ley engendran no solo un efecto, sino una serie de efectos. De estos, solo el primero es inmediato: se ve. Los demás solo se despliegan después: no se ven. El buen economista es el que toma en cuenta tanto el efecto que se ve como aquellos que hay que prever.", a: "Frédéric Bastiat, Lo que se ve y lo que no se ve (1850)" },
      { t: "La demanda y la oferta son las dos hojas de una tijera: discutir cuál de las dos corta el papel es perder el tiempo. El precio no lo fija el coste de producción solo, ni la utilidad para el consumidor sola, sino el encuentro de ambos en el mercado.", a: "Alfred Marshall, Principios de economía (1890)" },
      { t: "El consumo ostensible de bienes valiosos es un medio de adquirir reputación para el caballero de ocio. No compramos solo lo que necesitamos: compramos para mostrar a los demás lo que podemos pagar. La demanda nunca es puramente racional; está atravesada de estatus.", a: "Thorstein Veblen, Teoría de la clase ociosa (1899)" },
      { t: "A largo plazo todos estaremos muertos. Los economistas se asignan a sí mismos una tarea demasiado fácil, demasiado inútil, si en plena tempestad solo pueden decirnos que cuando la tormenta amaine, el océano estará en calma otra vez.", a: "John Maynard Keynes, Tract on Monetary Reform (1923)" },
      { t: "Los hombres prácticos, que se creen exentos de toda influencia intelectual, suelen ser esclavos de algún economista difunto. Las ideas de los economistas y de los filósofos políticos, tanto cuando aciertan como cuando no, gobiernan el mundo más de lo que se suele creer.", a: "John Maynard Keynes, Teoría general (1936)" },
      { t: "El proceso de destrucción creativa es el hecho esencial del capitalismo. El motor que mantiene en movimiento la máquina viene de nuevos bienes, nuevos métodos, nuevos mercados, nuevas formas de organización: cada innovación destruye estructuras económicas viejas y crea otras. El equilibrio permanente es una ficción.", a: "Joseph Schumpeter, Capitalismo, socialismo y democracia (1942)" },
      { t: "Un mercado autoregulado exige separar institucionalmente la sociedad en una esfera económica y otra política, lo cual es una imposibilidad: el mercado siempre está incrustado en relaciones sociales, leyes y costumbres. Pensar que puede funcionar «solo», sin intervención política, es un mito político, no una descripción.", a: "Karl Polanyi, La gran transformación (1944)" },
      { t: "Los precios son señales que coordinan los planes de millones de personas sin que ninguna de ellas conozca el plan completo. Cuando el café sube en Brasil, un panadero en París cambia su pedido sin saber por qué: el sistema de precios transmite información dispersa de forma más eficiente que cualquier autoridad central.", a: "Friedrich Hayek, El uso del conocimiento en la sociedad (1945)" },
      { t: "El mercado no es un lugar, una cosa o una entidad colectiva: es un proceso, accionado por la interacción de las múltiples acciones de los individuos que cooperan bajo la división del trabajo. Los precios no son fijados desde arriba: emergen del juicio diario de millones de compradores y vendedores.", a: "Ludwig von Mises, La acción humana (1949)" },
      { t: "Si los costes de transacción fueran cero, los recursos siempre acabarían en el uso más eficiente, sin importar la asignación inicial de derechos. Pero los costes nunca son cero: por eso las instituciones, los contratos y la claridad de la propiedad importan tanto como los precios.", a: "Ronald Coase, El problema del coste social (1960)" },
      { t: "La política debe analizarse como un mercado: los políticos y burócratas también persiguen sus propios intereses, no la virtud abstracta. El error de la teoría tradicional fue suponer egoísmo en el sector privado y altruismo en el público. Son las mismas personas en ambos lados de la cancha.", a: "James M. Buchanan, El cálculo del consenso (1962)" },
      { t: "La inflación es siempre y en todas partes un fenómeno monetario, en el sentido de que solo puede producirse cuando la cantidad de dinero crece más rápidamente que la producción. Sin emisión excesiva, no hay subida sostenida de precios; con ella, es inevitable, aunque tarde en aparecer.", a: "Milton Friedman, Inflación: causas y consecuencias (1963)" },
      { t: "No hay tal cosa como un almuerzo gratis. Todo recurso que dedicas a una cosa es un recurso que dejas de dedicar a otra: cada elección económica es, en el fondo, una elección sobre lo que no harás. El coste de oportunidad es la categoría más subestimada de la economía cotidiana.", a: "Milton Friedman (1975)" },
      { t: "Nunca ha habido una hambruna en un país democrático con prensa libre. Los gobiernos sometidos al voto y a la crítica pública no pueden permitirse ignorar una catástrofe: el mercado, por sí solo, no impide la hambruna, pero la presión política sí. Desarrollo es expansión de libertades reales, no solo de PIB.", a: "Amartya Sen, Desarrollo y libertad (1999)" },
      { t: "Los mercados, por sí solos, no producen resultados eficientes cuando la información es imperfecta o los mercados están incompletos — y eso es siempre. La idea de la mano invisible asume que toda la información relevante está disponible para todos, pero el vendedor de coches usados sabe cosas que el comprador no.", a: "Joseph Stiglitz, discurso del Nobel (2001)" },
      { t: "Los individuos no son los actores racionales que la teoría económica supone. Decidimos con dos sistemas mentales: uno rápido, intuitivo y emocional; otro lento, deliberativo y lógico. Casi siempre nos guía el primero, y luego justificamos con el segundo lo que ya decidimos sin darnos cuenta.", a: "Daniel Kahneman, Pensar rápido, pensar despacio (2011)" },
      { t: "Cuando la tasa de rendimiento del capital supera la tasa de crecimiento de la economía (r > g), el patrimonio acumulado del pasado crece más rápido que los ingresos del trabajo del presente. Es la dinámica fundamental que concentra la riqueza en pocas manos a lo largo del tiempo.", a: "Thomas Piketty, El capital en el siglo XXI (2013)" }
    ];

    (function () {
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const dateEl = document.getElementById('date');
      const cardEl = document.getElementById('card');
      const hintEl = document.getElementById('hint');
      const newBtn = document.getElementById('newQuote');
      const copyBtn = document.getElementById('copyQuote');
      const shareBtn = document.getElementById('shareQuote');
      const toggleMeaningBtn = document.getElementById('toggleMeaning');
      const meaningEl = document.getElementById('meaning');

      const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

      function dayOfYear(d) {
        const start = new Date(d.getFullYear(), 0, 0);
        const diff = d - start;
        return Math.floor(diff / 86400000);
      }

      function quoteOfTheDay() {
        const today = new Date();
        const idx = (dayOfYear(today) + today.getFullYear()) % QUOTES.length;
        return QUOTES[idx];
      }

      function formatDate(d) {
        return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
      }

      function renderQuote(q, animate) {
        if (animate) {
          cardEl.classList.remove('swap');
          void cardEl.offsetWidth;
          cardEl.classList.add('swap');
        }
        quoteEl.textContent = q.t;
        authorEl.textContent = q.a;
        meaningEl.hidden = true;
        meaningEl.innerHTML = '';
        if (q.e) {
          toggleMeaningBtn.hidden = false;
          toggleMeaningBtn.textContent = 'Ver significado';
        } else {
          toggleMeaningBtn.hidden = true;
        }
      }

      toggleMeaningBtn.addEventListener('click', () => {
        const q = current;
        if (!q || !q.e) return;
        if (meaningEl.hidden) {
          meaningEl.innerHTML = q.e;
          meaningEl.hidden = false;
          toggleMeaningBtn.textContent = 'Ocultar';
        } else {
          meaningEl.hidden = true;
          toggleMeaningBtn.textContent = 'Ver significado';
        }
      });

      function showHint(text) {
        hintEl.textContent = text;
        hintEl.style.opacity = '1';
        clearTimeout(showHint._t);
        showHint._t = setTimeout(() => {
          hintEl.style.opacity = '0';
        }, 2200);
      }

      let current = quoteOfTheDay();
      dateEl.textContent = formatDate(new Date());
      renderQuote(current, false);

      newBtn.addEventListener('click', () => {
        let next;
        do {
          next = QUOTES[Math.floor(Math.random() * QUOTES.length)];
        } while (next.t === current.t && QUOTES.length > 1);
        current = next;
        renderQuote(current, true);
      });

      copyBtn.addEventListener('click', async () => {
        const text = `"${current.t}" — ${current.a}`;
        try {
          await navigator.clipboard.writeText(text);
          showHint('Cita copiada al portapapeles');
        } catch {
          showHint('No se pudo copiar');
        }
      });

      shareBtn.addEventListener('click', async () => {
        const text = `"${current.t}" — ${current.a}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: 'Cita del día para Gio', text });
          } catch {}
        } else {
          try {
            await navigator.clipboard.writeText(text);
            showHint('Compartir no disponible, cita copiada');
          } catch {
            showHint('Compartir no disponible');
          }
        }
      });

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    })();
  </script>
