      { t: "No es por la benevolencia del carnicero, del cervecero o del panadero que esperamos nuestra cena, sino por la consideración de su propio interés. Nos dirigimos no a su humanidad sino a su egoísmo, y nunca les hablamos de nuestras necesidades sino de las ventajas que obtendrán.", a: "Adam Smith, La riqueza de las naciones (1776)", e: "El mercado funciona porque alinea el interés individual con el servicio al otro: ganas atendiendo necesidades ajenas. <strong>En la vida:</strong> para que alguien haga algo por ti de modo sostenible, no apeles a su bondad — encuentra qué gana él haciéndolo. La cooperación basada en interés mutuo es más estable que la basada en favor." },
      { t: "Cada individuo, buscando su propio interés, es conducido por una mano invisible a promover un fin que no entraba en sus intenciones: el bien común. Persiguiendo su provecho personal, frecuentemente promueve el de la sociedad más eficazmente que si pretendiera promoverlo deliberadamente.", a: "Adam Smith, La riqueza de las naciones (1776)", e: "Las acciones individuales producen efectos colectivos no buscados: el orden social emerge sin coordinación central. <strong>En la vida:</strong> no todo lo bueno requiere planificarse desde arriba — muchos beneficios sociales nacen de interacciones espontáneas. Desconfía de quien promete diseñar el bien común si destruye los procesos espontáneos." },
      { t: "Los del mismo oficio raramente se reúnen, ni siquiera para entretenimiento o diversión, sin que la conversación termine en una conspiración contra el público o en alguna estratagema para subir los precios. El mercado necesita reglas precisamente porque sus actores tienden a coordinarse contra él.", a: "Adam Smith, La riqueza de las naciones (1776)", e: "Hasta el padre del liberalismo reconoce: los gremios tienden a coludirse y necesitan regulación. <strong>En la vida:</strong> en cualquier grupo profesional, hay tendencia natural a defender intereses comunes a costa del cliente o del usuario. No es maldad, es estructura. Por eso los contrapesos importan." },
      { t: "Bajo un sistema de comercio perfectamente libre, cada país dedica su capital y su trabajo a los empleos que le son más beneficiosos. Aun cuando un país sea menos eficiente en todo, le conviene especializarse en aquello donde su desventaja sea menor: la ventaja comparativa, no la absoluta, es lo que rige el comercio.", a: "David Ricardo, Principios de economía política (1817)", e: "Aunque seas peor que otros en todo, te conviene especializarte donde lo eres menos. <strong>En la vida:</strong> no necesitas ser el mejor en algo para que valga la pena dedicarte a ello — basta con que sea aquello en lo que te destacas relativamente más que en otras opciones. La comparación absoluta es trampa; la relativa es brújula." },
      { t: "Las leyes de la producción de la riqueza tienen el carácter de verdades físicas: no hay nada de opcional ni de arbitrario en ellas. No ocurre lo mismo con la distribución de la riqueza, que es asunto exclusivo de las instituciones humanas. Lo que se produce está sujeto a la naturaleza; lo que se reparte, a las leyes que la sociedad elige.", a: "John Stuart Mill, Principios de economía política (1848)", e: "Producir riqueza tiene reglas técnicas inflexibles; repartirla es decisión política. <strong>En la vida:</strong> separar los dos planos evita debates confusos. No es lo mismo discutir cómo crece un pastel que cómo se reparte. Confundirlo lleva a respuestas erradas en ambas." },
      { t: "En la esfera económica, un acto, una costumbre, una ley engendran no solo un efecto, sino una serie de efectos. De estos, solo el primero es inmediato: se ve. Los demás solo se despliegan después: no se ven. El buen economista es el que toma en cuenta tanto el efecto que se ve como aquellos que hay que prever.", a: "Frédéric Bastiat, Lo que se ve y lo que no se ve (1850)", e: "Toda decisión tiene efectos visibles (a corto plazo, sobre los beneficiarios directos) y efectos invisibles (a largo plazo, sobre los costes indirectos y los excluidos). <strong>En la vida:</strong> antes de aprobar una política o tomar una decisión personal, pregunta «¿qué no estoy viendo?». Lo invisible suele pesar más." },
      { t: "La demanda y la oferta son las dos hojas de una tijera: discutir cuál de las dos corta el papel es perder el tiempo. El precio no lo fija el coste de producción solo, ni la utilidad para el consumidor sola, sino el encuentro de ambos en el mercado.", a: "Alfred Marshall, Principios de economía (1890)", e: "El precio surge del encuentro entre lo que puede ofrecerse y lo que se está dispuesto a pagar. <strong>En la vida:</strong> tu valor profesional no se decide solo por lo que sabes hacer (oferta) ni por cuánto te quieren (demanda) — se decide en el cruce. Cuidar ambos lados es lo que sostiene una carrera." },
      { t: "El consumo ostensible de bienes valiosos es un medio de adquirir reputación para el caballero de ocio. No compramos solo lo que necesitamos: compramos para mostrar a los demás lo que podemos pagar. La demanda nunca es puramente racional; está atravesada de estatus.", a: "Thorstein Veblen, Teoría de la clase ociosa (1899)", e: "Buena parte de lo que compras es señal, no utilidad: el bolso caro, el reloj, el destino vacacional. <strong>En la vida:</strong> antes de gastar mucho, distingue: ¿esto lo quiero por lo que es o por lo que comunica? Las dos pueden ser válidas, pero la confusión te lleva a deudas con poco rédito interior." },
      { t: "A largo plazo todos estaremos muertos. Los economistas se asignan a sí mismos una tarea demasiado fácil, demasiado inútil, si en plena tempestad solo pueden decirnos que cuando la tormenta amaine, el océano estará en calma otra vez.", a: "John Maynard Keynes, Tract on Monetary Reform (1923)", e: "Decir «con el tiempo se arreglará» es eludir la responsabilidad presente. <strong>En la vida:</strong> ante una crisis real —tuya o de otros— no consueles con que «todo pasa». Actúa con lo que tienes ahora. El largo plazo solo llega para quienes sobreviven al corto plazo." },
      { t: "Los hombres prácticos, que se creen exentos de toda influencia intelectual, suelen ser esclavos de algún economista difunto. Las ideas de los economistas y de los filósofos políticos, tanto cuando aciertan como cuando no, gobiernan el mundo más de lo que se suele creer.", a: "John Maynard Keynes, Teoría general (1936)", e: "Quien dice «yo no soy ideológico, soy práctico» suele estar aplicando, sin saberlo, una teoría de hace décadas. <strong>En la vida:</strong> nadie es neutral. Examina las ideas que adoptaste sin elegirlas — son las que más te mandan. Solo pensándolas dejas de obedecerlas." },
      { t: "El proceso de destrucción creativa es el hecho esencial del capitalismo. El motor que mantiene en movimiento la máquina viene de nuevos bienes, nuevos métodos, nuevos mercados, nuevas formas de organización: cada innovación destruye estructuras económicas viejas y crea otras. El equilibrio permanente es una ficción.", a: "Joseph Schumpeter, Capitalismo, socialismo y democracia (1942)", e: "La innovación no solo añade — destruye lo anterior. El progreso siempre tiene víctimas. <strong>En la vida:</strong> esperar carreras o sectores estables es una ilusión. Lo que sirvió hace 20 años ya no sirve; quien no se reinventa, queda desplazado. La adaptabilidad es ya parte del oficio." },
      { t: "Un mercado autoregulado exige separar institucionalmente la sociedad en una esfera económica y otra política, lo cual es una imposibilidad: el mercado siempre está incrustado en relaciones sociales, leyes y costumbres. Pensar que puede funcionar «solo», sin intervención política, es un mito político, no una descripción.", a: "Karl Polanyi, La gran transformación (1944)", e: "No existe «el mercado» en abstracto — siempre necesita reglas, contratos, instituciones que lo hagan posible. <strong>En la vida:</strong> cuando oigas hablar de «dejar al mercado decidir», pregunta cuáles son las reglas previas que ya están operando. Nunca es ausencia de reglas; es presencia de unas reglas específicas." },
      { t: "Los precios son señales que coordinan los planes de millones de personas sin que ninguna de ellas conozca el plan completo. Cuando el café sube en Brasil, un panadero en París cambia su pedido sin saber por qué: el sistema de precios transmite información dispersa de forma más eficiente que cualquier autoridad central.", a: "Friedrich Hayek, El uso del conocimiento en la sociedad (1945)", e: "Nadie tiene la información completa del sistema, pero los precios sintetizan millones de decisiones individuales. <strong>En la vida:</strong> esto explica por qué planificaciones centralizadas suelen fracasar — ningún cerebro reúne la información dispersa. Confía más en señales descentralizadas que en planes maestros." },
      { t: "El mercado no es un lugar, una cosa o una entidad colectiva: es un proceso, accionado por la interacción de las múltiples acciones de los individuos que cooperan bajo la división del trabajo. Los precios no son fijados desde arriba: emergen del juicio diario de millones de compradores y vendedores.", a: "Ludwig von Mises, La acción humana (1949)", e: "El mercado es verbo, no sustantivo: ocurre, no es. <strong>En la vida:</strong> muchas «cosas» que tratas como objetos sólidos —la cultura, la economía, la opinión pública— son en realidad procesos en curso. Verlos como flujo y no como estado te ayuda a influir en ellos en vez de aceptarlos pasivamente." },
      { t: "Si los costes de transacción fueran cero, los recursos siempre acabarían en el uso más eficiente, sin importar la asignación inicial de derechos. Pero los costes nunca son cero: por eso las instituciones, los contratos y la claridad de la propiedad importan tanto como los precios.", a: "Ronald Coase, El problema del coste social (1960)", e: "Hacer un trato cuesta tiempo, información, abogados, confianza — y esos costes determinan qué se hace y qué no. <strong>En la vida:</strong> antes de evaluar una posibilidad, calcula no solo el beneficio teórico sino los costes de coordinarse para lograrla. A veces lo «mejor» no se hace porque los costes de transacción lo bloquean." },
      { t: "La política debe analizarse como un mercado: los políticos y burócratas también persiguen sus propios intereses, no la virtud abstracta. El error de la teoría tradicional fue suponer egoísmo en el sector privado y altruismo en el público. Son las mismas personas en ambos lados de la cancha.", a: "James M. Buchanan, El cálculo del consenso (1962)", e: "Los funcionarios y políticos buscan reelegirse, ascender, beneficiar a su grupo — igual que un empresario busca ganar. <strong>En la vida:</strong> antes de confiar en que «el Estado lo arregle», pregunta qué incentivos tienen los actores estatales. Diseñar bien los incentivos importa más que apelar a la buena voluntad." },
      { t: "La inflación es siempre y en todas partes un fenómeno monetario, en el sentido de que solo puede producirse cuando la cantidad de dinero crece más rápidamente que la producción. Sin emisión excesiva, no hay subida sostenida de precios; con ella, es inevitable, aunque tarde en aparecer.", a: "Milton Friedman, Inflación: causas y consecuencias (1963)", e: "La inflación no es culpa de los comerciantes ni de los empresarios — viene de imprimir más dinero del que la economía produce. <strong>En la vida:</strong> cuando un gobierno «soluciona» problemas emitiendo, está cobrándote un impuesto invisible: la pérdida de poder adquisitivo de lo que ya tienes ahorrado." },
      { t: "No hay tal cosa como un almuerzo gratis. Todo recurso que dedicas a una cosa es un recurso que dejas de dedicar a otra: cada elección económica es, en el fondo, una elección sobre lo que no harás. El coste de oportunidad es la categoría más subestimada de la economía cotidiana.", a: "Milton Friedman (1975)", e: "Cada decisión cierra puertas: lo que ganas siempre tiene como contrapartida lo que dejas de ganar en otro lado. <strong>En la vida:</strong> el verdadero precio de algo no es lo que pagaste — es todo lo que no hiciste con esos recursos. Aplícalo al dinero, al tiempo, a las relaciones. Casi nada es gratis." },
      { t: "Nunca ha habido una hambruna en un país democrático con prensa libre. Los gobiernos sometidos al voto y a la crítica pública no pueden permitirse ignorar una catástrofe: el mercado, por sí solo, no impide la hambruna, pero la presión política sí. Desarrollo es expansión de libertades reales, no solo de PIB.", a: "Amartya Sen, Desarrollo y libertad (1999)", e: "Las libertades civiles son herramientas económicas: una prensa libre fuerza al gobierno a responder ante crisis. <strong>En la vida:</strong> en cualquier organización, asegurar canales de crítica y transparencia no es opcional — es la mejor protección contra desastres. Sin voz crítica, los problemas se ocultan hasta volverse irreparables." },
      { t: "Los mercados, por sí solos, no producen resultados eficientes cuando la información es imperfecta o los mercados están incompletos — y eso es siempre. La idea de la mano invisible asume que toda la información relevante está disponible para todos, pero el vendedor de coches usados sabe cosas que el comprador no.", a: "Joseph Stiglitz, discurso del Nobel (2001)", e: "Cuando una parte sabe más que la otra (médico/paciente, agente/cliente, vendedor/comprador), el mercado se distorsiona. <strong>En la vida:</strong> en cualquier transacción importante, identifica quién tiene la información asimétrica. Negociar a ciegas es perder. Investigar antes de firmar es lo único que iguala el juego." },
      { t: "Los individuos no son los actores racionales que la teoría económica supone. Decidimos con dos sistemas mentales: uno rápido, intuitivo y emocional; otro lento, deliberativo y lógico. Casi siempre nos guía el primero, y luego justificamos con el segundo lo que ya decidimos sin darnos cuenta.", a: "Daniel Kahneman, Pensar rápido, pensar despacio (2011)", e: "Lo que llamas «razonar» es muchas veces racionalizar una intuición ya tomada. <strong>En la vida:</strong> antes de defender con argumentos una opinión fuerte, pregúntate si realmente la dedujiste o si llegaste primero a la conclusión y luego buscaste las razones. La autohonestidad mental empieza ahí." },
      { t: "Cuando la tasa de rendimiento del capital supera la tasa de crecimiento de la economía (r > g), el patrimonio acumulado del pasado crece más rápido que los ingresos del trabajo del presente. Es la dinámica fundamental que concentra la riqueza en pocas manos a lo largo del tiempo.", a: "Thomas Piketty, El capital en el siglo XXI (2013)", e: "Si tu dinero invertido rinde más rápido que el salario promedio, los herederos del capital se distancian de los trabajadores. <strong>En la vida:</strong> entender que el capital crece más rápido que el trabajo explica por qué ahorrar e invertir es crucial — y por qué la herencia tiene tanto peso. No basta con trabajar: hay que poner el dinero a trabajar también." }
    ];

    (function () {
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const dateEl = document.getElementById('date');
      const cardEl = document.getElementById('card');
      const hintEl = document.getElementById('hint');
      const newBtn = document.getElementById('newQuote');
      const copyBtn = document.getElementById('copyQuote');
      const shareBtn = document.getElementById('shareQuote');
      const toggleMeaningBtn = document.getElementById('toggleMeaning');
      const meaningEl = document.getElementById('meaning');

      const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

      function dayOfYear(d) {
        const start = new Date(d.getFullYear(), 0, 0);
        const diff = d - start;
        return Math.floor(diff / 86400000);
      }

      function quoteOfTheDay() {
        const today = new Date();
        const idx = (dayOfYear(today) + today.getFullYear()) % QUOTES.length;
        return QUOTES[idx];
      }

      function formatDate(d) {
        return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
      }

      function renderQuote(q, animate) {
        if (animate) {
          cardEl.classList.remove('swap');
          void cardEl.offsetWidth;
          cardEl.classList.add('swap');
        }
        quoteEl.textContent = q.t;
        authorEl.textContent = q.a;
        meaningEl.hidden = true;
        meaningEl.innerHTML = '';
        if (q.e) {
          toggleMeaningBtn.hidden = false;
          toggleMeaningBtn.textContent = 'Ver significado';
        } else {
          toggleMeaningBtn.hidden = true;
        }
      }

      toggleMeaningBtn.addEventListener('click', () => {
        const q = current;
        if (!q || !q.e) return;
        if (meaningEl.hidden) {
          meaningEl.innerHTML = q.e;
          meaningEl.hidden = false;
          toggleMeaningBtn.textContent = 'Ocultar';
        } else {
          meaningEl.hidden = true;
          toggleMeaningBtn.textContent = 'Ver significado';
        }
      });

      function showHint(text) {
        hintEl.textContent = text;
        hintEl.style.opacity = '1';
        clearTimeout(showHint._t);
        showHint._t = setTimeout(() => {
          hintEl.style.opacity = '0';
        }, 2200);
      }

      let current = quoteOfTheDay();
      dateEl.textContent = formatDate(new Date());
      renderQuote(current, false);

      newBtn.addEventListener('click', () => {
        let next;
        do {
          next = QUOTES[Math.floor(Math.random() * QUOTES.length)];
        } while (next.t === current.t && QUOTES.length > 1);
        current = next;
        renderQuote(current, true);
      });

      copyBtn.addEventListener('click', async () => {
        const text = `"${current.t}" — ${current.a}`;
        try {
          await navigator.clipboard.writeText(text);
          showHint('Cita copiada al portapapeles');
        } catch {
          showHint('No se pudo copiar');
        }
      });

      shareBtn.addEventListener('click', async () => {
        const text = `"${current.t}" — ${current.a}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: 'Cita del día para Gio', text });
          } catch {}
        } else {
          try {
            await navigator.clipboard.writeText(text);
            showHint('Compartir no disponible, cita copiada');
          } catch {
            showHint('Compartir no disponible');
          }
        }
      });

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
